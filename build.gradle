plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.148'
}

group = 'dev.logos.dimension'
version = mod_version
base { archivesName = mod_id }
java.toolchain.languageVersion = JavaLanguageVersion.of(25)

repositories {
    maven { url = 'https://maven.firstdark.dev/snapshots' }
    exclusiveContent {
        forRepository { maven { url = 'https://api.modrinth.com/maven' } }
        filter { includeGroup 'maven.modrinth' }
    }
}

neoForge {
    version = neo_version
    runs {
        client { client() }
        server {
            server(); programArgument '--nogui'
            if (project.hasProperty('journeyLocateStage')) {
                gameDirectory = file(project.property('journeyLocateStage') == 'upgrade' ? 'runs/journeyLocateUpgrade' : project.property('journeyLocateStage') == 'seed' ? 'runs/journeyLocateSeed' : 'runs/journeyLocate')
                systemProperty 'logos_dimension.locate_stage', project.property('journeyLocateStage')
            }
            if (project.hasProperty('cauldronPersistenceStage')) {
                gameDirectory = file('runs/cauldronPersistence')
                systemProperty 'logos_dimension.persistence_stage', project.property('cauldronPersistenceStage')
            }
        }
        gameTestServer {
            type = 'gameTestServer'
            systemProperty 'neoforge.enabledGameTestNamespaces', mod_id
            // 26.1's GameTestServer deliberately ignores datapack LevelStems. Supply a test-only
            // flat preset containing the real generator; this pack is never shipped with the mod.
            programArguments.addAll '--tests', providers.gradleProperty('dimensionTests').getOrElse("${mod_id}:*"), '--packs', file('gametest-packs').absolutePath,
                    '--report', file('build/gametest-results.xml').absolutePath
        }
        configureEach { logLevel = org.slf4j.event.Level.INFO }
    }
    mods { logos_dimension { sourceSet sourceSets.main } }
    unitTest { enable(); testedMod = mods.logos_dimension }
}

dependencies {
    // 编译期依赖 Logos，以复用它的公开特效入口 dev.logos.runtime.Vfx（见 docs/VFX.md）。
    // 安装包里不含 Logos 的代码或物品，玩家自己装。jar 路径用 -PlogosJar 传，或写进 ~/.gradle/gradle.properties
    def logosJar = providers.gradleProperty('logosJar')
    if (!logosJar.isPresent()) {
        throw new GradleException('缺少 -PlogosJar=/absolute/path/logos-x.y.z.jar：附属编译期依赖 Logos，见 docs/VFX.md')
    }
    implementation files(logosJar.get())
    implementation "com.lowdragmc.ldlib2:ldlib2-neoforge-26.1:${ldlib2_version}"
    // 附属自己的 Photon 特效直接编译 Photon；版本跟 Logos 的 gradle.properties 保持一致
    implementation("com.lowdragmc.photon:photon-neoforge-26.1:${photon_version}") { transitive = false }
    runtimeOnly("com.lowdragmc.kilagraph:kilagraph-neoforge-26.1:${kilagraph_version}") { transitive = false }
    // NPC 渲染器直接使用 GeckoLib 的类；Logos 本身也依赖它，所以玩家不需要另装
    implementation "maven.modrinth:geckolib:${geckolib_version}"
    testImplementation 'org.junit.jupiter:junit-jupiter:5.11.4'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test', Test) { useJUnitPlatform(); testLogging { events 'passed', 'failed' } }
tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8' }

if (file('gradle/ldlib2-uitest.gradle').exists()) {
    apply from: 'gradle/ldlib2-uitest.gradle'
}
