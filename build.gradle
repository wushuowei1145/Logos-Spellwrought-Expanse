plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.148'
}

group = 'dev.logos.dimension'
version = mod_version
base { archivesName = mod_id }
java.toolchain.languageVersion = JavaLanguageVersion.of(25)

// 车万女仆是可选的（女仆用爆裂魔杖；女仆在音乐厅里演奏的测试场景 MaidHallViews）。26.1 版还没上任何 Maven，
// 编译时用本地的 jar：-Ptlm_jar=<路径> 或 libs/touhoulittlemaid.jar；没有 jar 时那个场景不参与编译，游戏照常（同 Logos）。
// 女仆的演奏姿势本身在星辰花乐团里（MaidMusicians），那边的发布 jar 要带着女仆的 jar 编译。
def tlmJar = file(project.findProperty('tlm_jar') ?: 'libs/touhoulittlemaid.jar')
if (!tlmJar.exists()) {
    logger.lifecycle("Touhou Little Maid compat left out: no jar at ${tlmJar} (pass -Ptlm_jar=<path>)")
    sourceSets.main.java { exclude 'dev/logos/dimension/client/music/MaidHallViews.java' }
}

repositories {
    maven { url = 'https://maven.firstdark.dev/snapshots' }
    exclusiveContent {
        forRepository { maven { url = 'https://api.modrinth.com/maven' } }
        filter { includeGroup 'maven.modrinth' }
    }
    // JEI（可选的配方查看）：BlameJared 的 Maven，只在那里找 JEI 和它的配置库，和 Logos 一样。
    exclusiveContent {
        forRepository { maven { url = 'https://maven.blamejared.com' } }
        filter { includeGroup 'mezz.jei'; includeGroup 'net.mezzdev.config' }
    }
}

neoForge {
    version = neo_version
    runs {
        client { client() }
        server {
            server(); programArgument '--nogui'
            if (project.hasProperty('journeyLocateStage')) {
                gameDirectory = file(project.property('journeyLocateStage') == 'upgrade' ? 'runs/journeyLocateUpgrade' : project.property('journeyLocateStage') == 'seed' ? 'runs/journeyLocateSeed' : 'runs/journeyLocate')
                systemProperty 'logos_dimension.locate_stage', project.property('journeyLocateStage')
            }
            if (project.hasProperty('cauldronPersistenceStage')) {
                gameDirectory = file('runs/cauldronPersistence')
                systemProperty 'logos_dimension.persistence_stage', project.property('cauldronPersistenceStage')
            }
        }
        gameTestServer {
            type = 'gameTestServer'
            systemProperty 'neoforge.enabledGameTestNamespaces', mod_id
            // 26.1's GameTestServer deliberately ignores datapack LevelStems. Supply a test-only
            // flat preset containing the real generator; this pack is never shipped with the mod.
            programArguments.addAll '--tests', providers.gradleProperty('dimensionTests').getOrElse("${mod_id}:*"), '--packs', file('gametest-packs').absolutePath,
                    '--report', file('build/gametest-results.xml').absolutePath
            // 查偶发失败用：-PdimensionTestRepeat=50 把选中的每个测试复制 50 份放进同一批，散在不同位置一起跑
            if (project.hasProperty('dimensionTestRepeat')) programArguments.addAll '--repeatCount', project.property('dimensionTestRepeat').toString()
        }
        configureEach { logLevel = org.slf4j.event.Level.INFO }
    }
    mods { logos_dimension { sourceSet sourceSets.main } }
    unitTest { enable(); testedMod = mods.logos_dimension }
}

dependencies {
    // 编译期依赖 Logos，以复用它的公开特效入口 dev.logos.runtime.Vfx（见 docs/VFX.md）。
    // 安装包里不含 Logos 的代码或物品，玩家自己装。jar 路径用 -PlogosJar 传，或写进 ~/.gradle/gradle.properties
    def logosJar = providers.gradleProperty('logosJar')
    if (!logosJar.isPresent()) {
        throw new GradleException('缺少 -PlogosJar=/absolute/path/logos-x.y.z.jar：附属编译期依赖 Logos，见 docs/VFX.md')
    }
    implementation files(logosJar.get())
    // 乐器在独立的模组「星辰花乐团」（starbloom_orchestra）里，附属依赖它：NPC 乐手（NpcMusician）、音乐厅的测试场景
    // 直接用它的类。jar 路径用 -PorchestraJar 传，或写进 ~/.gradle/gradle.properties；玩家自己装（附属的 jar 里不含它）
    def orchestraJar = providers.gradleProperty('orchestraJar')
    if (!orchestraJar.isPresent()) {
        throw new GradleException('缺少 -PorchestraJar=/absolute/path/starbloom_orchestra-x.y.z.jar：附属依赖星辰花乐团（乐器），见 README')
    }
    implementation files(orchestraJar.get())
    implementation "com.lowdragmc.ldlib2:ldlib2-neoforge-26.1:${ldlib2_version}"
    // 附属自己的 Photon 特效直接编译 Photon；版本跟 Logos 的 gradle.properties 保持一致
    implementation("com.lowdragmc.photon:photon-neoforge-26.1:${photon_version}") { transitive = false }
    runtimeOnly("com.lowdragmc.kilagraph:kilagraph-neoforge-26.1:${kilagraph_version}") { transitive = false }
    // NPC 渲染器直接使用 GeckoLib 的类；Logos 本身也依赖它，所以玩家不需要另装
    implementation "maven.modrinth:geckolib:${geckolib_version}"
    // 车万女仆只在编译时用；-Ptlm 把它加进开发环境的运行（测试场景里的女仆）
    if (tlmJar.exists()) {
        compileOnly files(tlmJar)
        if (project.hasProperty('tlm')) runtimeOnly files(tlmJar)
    }
    // JEI 可选：只对着它的接口编译，铸弹台的三种配方和每种弹的外观在装了 JEI 时显示（compat/jei）；-Pjei 把它放进开发运行
    compileOnly "mezz.jei:jei-${jei_minecraft_version}-common-api:${jei_version}"
    compileOnly "mezz.jei:jei-${jei_minecraft_version}-neoforge-api:${jei_version}"
    if (project.hasProperty('jei')) runtimeOnly "mezz.jei:jei-${jei_minecraft_version}-neoforge:${jei_version}"
    testImplementation 'org.junit.jupiter:junit-jupiter:5.11.4'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test', Test) {
    useJUnitPlatform()
    testLogging { events 'passed', 'failed' }
}
// 测试 JVM 的工作目录由模组测试器决定；通过测试资源读取预设，避免依赖当前目录。
tasks.named('processTestResources') {
    from('gametest-packs/crucible/data/minecraft/worldgen/world_preset/flat.json') {
        into 'fixtures'
        rename { 'journey-world-preset.json' }
    }
}
tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8' }


if (file('gradle/ldlib2-uitest.gradle').exists()) {
    apply from: 'gradle/ldlib2-uitest.gradle'
}
