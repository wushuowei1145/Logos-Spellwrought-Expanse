name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      logos_ref:
        description: 用于构建的 MinecraftLogosMod 分支、标签或提交（默认取 LOGOS_REF）
      orchestra_ref:
        description: 用于构建的 StarbloomOrchestra 分支、标签或提交（默认取 ORCHESTRA_REF）

permissions:
  contents: read

env:
  # 本 Mod 编译所依赖的 Logos 提交；需要更新的 Logos 代码时改这一行。
  LOGOS_REF: dc3d381f7171760c7003a84fcdada24096e8435a
  # 乐器在星辰花乐团（starbloom_orchestra）里，附属编译、测试都要它的 jar；乐器那边的接口改了时改这一行。
  ORCHESTRA_REF: ca57e94bca1c5e428f7f285f819ce8c8742f0aaa

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle

      # build.gradle 编译时需要 Logos jar（-PlogosJar），而 Logos 没有发布版本，只能从源码构建。
      - name: Check out Logos
        uses: actions/checkout@v7
        with:
          repository: MagicFoxDemon/MinecraftLogosMod
          ref: ${{ inputs.logos_ref || env.LOGOS_REF }}
          path: logos-src

      - name: Resolve Logos commit
        id: logos-sha
        run: echo "sha=$(git -C logos-src rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Restore Logos jar
        id: logos-jar
        uses: actions/cache@v6
        with:
          path: ~/.cache/logos-jar
          key: logos-jar-${{ steps.logos-sha.outputs.sha }}

      - name: Build Logos jar
        if: steps.logos-jar.outputs.cache-hit != 'true'
        working-directory: logos-src
        # Logos 仓库里的 gradlew 没有可执行权限。
        run: |
          sh ./gradlew jar
          mkdir -p ~/.cache/logos-jar
          cp build/libs/logos-*.jar ~/.cache/logos-jar/logos.jar

      # 星辰花乐团同样没有发布版本，从源码构建
      - name: Check out Starbloom Orchestra
        uses: actions/checkout@v7
        with:
          repository: MagicFoxDemon/StarbloomOrchestra
          ref: ${{ inputs.orchestra_ref || env.ORCHESTRA_REF }}
          path: orchestra-src

      - name: Resolve Starbloom Orchestra commit
        id: orchestra-sha
        run: echo "sha=$(git -C orchestra-src rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Restore Starbloom Orchestra jar
        id: orchestra-jar
        uses: actions/cache@v6
        with:
          path: ~/.cache/orchestra-jar
          key: orchestra-jar-${{ steps.orchestra-sha.outputs.sha }}

      - name: Build Starbloom Orchestra jar
        if: steps.orchestra-jar.outputs.cache-hit != 'true'
        working-directory: orchestra-src
        run: |
          sh ./gradlew jar
          mkdir -p ~/.cache/orchestra-jar
          cp build/libs/starbloom_orchestra-*.jar ~/.cache/orchestra-jar/orchestra.jar

      - name: Test and build
        run: ./gradlew test build "-PlogosJar=$HOME/.cache/logos-jar/logos.jar" "-PorchestraJar=$HOME/.cache/orchestra-jar/orchestra.jar"

      - name: Run GameTests
        run: ./gradlew runGameTestServer "-PlogosJar=$HOME/.cache/logos-jar/logos.jar" "-PorchestraJar=$HOME/.cache/orchestra-jar/orchestra.jar"

      - name: Upload test reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: test-reports
          path: |
            build/reports/tests/
            build/gametest-results.xml
          if-no-files-found: ignore
          retention-days: 7
